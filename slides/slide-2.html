<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to SDD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Outfit', sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two equal columns */
            overflow: hidden;
        }

        .image-panel {
            background-image: url('assets/slide-2.jpg');
            background-size: cover;
            background-position: center;
            position: relative; /* For the overlay */
        }

        .content-panel {
            background-color: #1e1e1e;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 30px;
            color: #ffffff;
            animation: slideUp 0.8s ease-out;
            transform: translateY(20px); /* Start below */
            opacity: 0;
            animation-fill-mode: forwards; /* Keep the final state */
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        ul {
            list-style: none;
            padding: 0;
            font-size: 1.6em;
            line-height: 1.8;
        }

        li::before {
            content: "→";
            color: #64b5f6; /* A vibrant blue */
            display: inline-block;
            width: 1em;
            margin-left: -1em;
        }
        .slide-number {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1.2em;
            color: #777;
        }
    </style>
</head>
<body>

<div class="slide-container">

    <div class="image-panel">
        <!-- Image is set as a background -->
    </div>

    <div class="content-panel">
        <h1>Introduction to SDD</h1>
        <ul>
            <li>SDD stands for Spec-Driven Development</li>
            <li>It moves quality upstream</li>
            <li>Specified intent is the key</li>
        </ul>
    </div>

    <div class="slide-number">2 / 3</div>
</div>

</body>
</html>
